# /etc/nginx/sites-available/toyforge.chupa.nexus
# After enabling, run:  sudo certbot --nginx -d toyforge.chupa.nexus
# certbot adds the 443 listener, certificates and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name toyforge.chupa.nexus;

    # STL (≤10 MB) + thumbnail + fields
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (kept at server level so every location inherits them)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/toyforge.access.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Large ZIP downloads are streamed: no buffering, longer timeout
    location = /api/teacher/models.zip {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        access_log off;  # URL carries a one-time download token
    }
}
